<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心情随笔 · 暖心祝福</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(120deg, #e8f4f8, #fef6f9);
      min-height: 100vh;
      padding: 60px 20px;
    }

    /* 1440px 宽屏容器 */
    .container {
      width: 1440px;
      margin: 0 auto;
    }

    .title {
      text-align: center;
      font-size: 36px;
      color: #5a8ca8;
      margin-bottom: 50px;
      font-weight: 500;
    }

    .card-box {
      background: #ffffffcc;
      border-radius: 28px;
      box-shadow: 0 10px 40px rgba(90, 140, 168, 0.15);
      padding: 60px 80px;
      backdrop-filter: blur(8px);
    }

    .input-wrap {
      margin-bottom: 35px;
    }

    label {
      display: block;
      font-size: 18px;
      color: #667885;
      margin-bottom: 12px;
    }

    #moodInput {
      width: 100%;
      height: 120px;
      border: 1px solid #d8e6ee;
      border-radius: 16px;
      padding: 20px;
      font-size: 16px;
      color: #444;
      background: #fafcfe;
      resize: none;
      outline: none;
      transition: all 0.3s ease;
    }

    #moodInput:focus {
      border-color: #87b8d8;
      box-shadow: 0 0 0 4px rgba(135, 184, 216, 0.2);
    }

    .btn-get {
      padding: 14px 40px;
      background: #87b8d8;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-get:hover {
      background: #69a2c7;
    }

    .result-box {
      margin-top: 40px;
      padding: 30px;
      background: #f5f9fc;
      border-radius: 20px;
      border-left: 5px solid #87b8d8;
    }

    .result-title {
      font-size: 16px;
      color: #8899a6;
      margin-bottom: 15px;
    }

    .bless-text {
      font-size: 20px;
      color: #4a6577;
      line-height: 1.8;
    }

    /* 小屏兼容：小于1440px自动占满 */
    @media (max-width: 1440px) {
      .container {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="title">🌿 心情随笔 · 专属暖心祝福</h2>

    <div class="card-box">
      <div class="input-wrap">
        <label>写下你此刻的心情描述：</label>
        <textarea id="moodInput" placeholder="例如：有点疲惫、今天很开心、有点迷茫、想放空一会……"></textarea>
      </div>

      <button class="btn-get" onclick="getRandomBless()">生成专属心情祝福</button>

      <div class="result-box">
        <div class="result-title">✨ 为你生成的暖心祝福：</div>
        <div class="bless-text" id="blessText">请输入心情，点击按钮生成祝福</div>
      </div>
    </div>
  </div>

  <script>
    // 暖心祝福语库
    const blessList = [
      "愿你眼里有光，心中有爱，日子慢慢温柔起来。",
      "不必着急追赶世界，好好善待自己，就是最好的生活。",
      "所有的疲惫都会散去，往后皆是温柔与好运。",
      "允许自己偶尔低落，也记得给自己一份温柔拥抱。",
      "风会吹散烦恼，光会照亮前路，愿你事事顺心。",
      "平凡的日子也有小美好，愿你日日安然，岁岁欢喜。",
      "心里装着温柔，生活就会慢慢对你温柔以待。",
      "放过焦虑，接纳当下，一切都会慢慢变好。",
      "愿你保持热爱，奔赴山海，不负时光不负自己。",
      "当下的情绪都值得被温柔倾听，愿你安稳自在。"
    ];

    function getRandomBless() {
      const inputVal = document.getElementById("moodInput").value.trim();
      const randomIndex = Math.floor(Math.random() * blessList.length);
      
      // 不管输入什么心情，都给出随机暖心祝福
      document.getElementById("blessText").innerText = 
        `你说：${inputVal || "随心有感"}\n💌 ${blessList[randomIndex]}`;
    }
  </script>
</body>
</html>
