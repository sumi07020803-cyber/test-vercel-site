<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小清新天气预报</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(to top, #e0f7fa 0%, #f1f8e9 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #37474f;
    }

    .weather-box {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      padding: 30px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 8px 30px rgba(0, 121, 107, 0.1);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .title {
      font-size: 22px;
      color: #00796b;
      margin-bottom: 10px;
    }

    .city {
      font-size: 16px;
      color: #607d8b;
      margin-bottom: 20px;
    }

    .temp {
      font-size: 48px;
      font-weight: bold;
      color: #004d40;
      margin: 10px 0;
    }

    .desc {
      font-size: 18px;
      color: #455a64;
      margin-bottom: 10px;
    }

    .info {
      font-size: 14px;
      color: #546e7a;
      margin-top: 10px;
    }

    .refresh {
      margin-top: 25px;
      padding: 10px 20px;
      background: #80e27e;
      color: #1b5e20;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    .refresh:hover {
      background: #66bb6a;
    }
  </style>
</head>

<body>
  <div class="weather-box">
    <div class="title">☀️ 小清新天气预报</div>
    <div class="city" id="city">正在获取定位...</div>
    <div class="temp" id="temp">--℃</div>
    <div class="desc" id="desc">--</div>
    <div class="info" id="info">湿度 --% | 风速 --m/s</div>
    <button class="refresh" onclick="getWeather()">🔄 刷新天气</button>
  </div>

  <script>
    // 实时获取当前城市 + 实时天气（免费公开接口，无需KEY）
    async function getWeather() {
      try {
        document.getElementById('city').innerText = "正在获取天气...";
        
        // 获取定位
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject);
        });

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        // 实时天气接口
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=weather_code&timezone=auto`);
        
        const data = await res.json();
        const temp = data.current.temperature_2m;
        const humidity = data.current.relative_humidity_2m;
        const wind = data.current.wind_speed_10m;

        // 城市逆地理编码
        const geo = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
        const geoData = await geo.json();
        const city = geoData.address.city || geoData.address.town || "当前城市";

        // 天气描述
        const weatherMap = {
          0: "晴天", 1: "晴", 2: "多云", 3: "阴天",
          45: "雾", 48: "雾凇",
          51: "小雨", 53: "中雨", 55: "大雨",
          61: "小雨", 63: "中雨", 65: "大雨",
          71: "小雪", 73: "中雪", 75: "大雪"
        };
        const code = data.hourly.weather_code[0];
        const desc = weatherMap[code] || "晴朗";

        // 渲染页面
        document.getElementById('city').innerText = city;
        document.getElementById('temp').innerText = temp + "℃";
        document.getElementById('desc').innerText = desc;
        document.getElementById('info').innerText = `湿度 ${humidity}% | 风速 ${wind}m/s`;

      } catch (err) {
        document.getElementById('city').innerText = "获取失败，请允许定位";
        console.log(err);
      }
    }

    // 打开页面自动加载
    window.onload = getWeather();
  </script>
</body>
</html>
