<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心情小助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .input-group {
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            max-width: 800px;
            height: 120px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #68d391;
        }
        button {
            background: linear-gradient(135deg, #68d391, #48bb78);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.3);
        }
        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }
        .output {
            margin-top: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 15px;
            border-left: 5px solid #68d391;
            text-align: left;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .output h3 {
            color: #2d3748;
            margin-bottom: 10px;
        }
        .output p {
            color: #4a5568;
            line-height: 1.6;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #68d391;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #e53e3e;
            background: #fed7d7;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 2rem;
            }
            textarea {
                height: 100px;
            }
            button {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 心情小助手</h1>
        <div class="input-group">
            <textarea id="moodInput" placeholder="请分享你当下的心情、情绪或心事..."></textarea>
            <br>
            <button id="analyzeBtn" onclick="analyzeMood()">开始分析</button>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI正在温柔地分析你的心情...</p>
        </div>
        <div class="output" id="output" style="display: none;">
            <h3>💕 AI的陪伴</h3>
            <p id="responseText"></p>
        </div>
        <div class="error" id="error" style="display: none;">
            <p id="errorText"></p>
        </div>
    </div>

    <script>
        async function analyzeMood() {
            const input = document.getElementById('moodInput').value.trim();
            if (!input) {
                showError('请先输入你的心情哦~');
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const output = document.getElementById('output');
            const error = document.getElementById('error');

            btn.disabled = true;
            loading.style.display = 'block';
            output.style.display = 'none';
            error.style.display = 'none';

            try {
                const response = await fetch('https://api-inference.huggingface.co/models/microsoft/DialoGPT-medium', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        inputs: {
                            past_user_inputs: [],
                            generated_responses: [],
                            text: `用户的心情：${input}。请作为温柔的AI助手，分析用户的情绪原因，提供安慰和陪伴。`
                        },
                        parameters: {
                            max_length: 200,
                            temperature: 0.7,
                            do_sample: true
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('AI服务暂时不可用，请稍后再试');
                }

                const data = await response.json();
                const aiResponse = data.generated_text || data[0]?.generated_text || '抱歉，我现在有点迷糊，但请记住，你并不孤单。';

                document.getElementById('responseText').textContent = aiResponse;
                output.style.display = 'block';
            } catch (err) {
                showError('连接AI服务失败了，但请相信，一切都会好起来的。错误：' + err.message);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showError(message) {
            const error = document.getElementById('error');
            document.getElementById('errorText').textContent = message;
            error.style.display = 'block';
        }
    </script>
</body>
</html>
